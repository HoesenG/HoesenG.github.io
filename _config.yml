# Site settings. Restart `jekyll serve` after editing this file.

title: Houxuan Guo
tagline: Ph.D. Candidate at Northwestern University
description: >-
  Houxuan Guo, Ph.D. candidate in Computer Engineering at Northwestern University,
  working on fault-tolerant ML accelerators, on-device learning, and
  hardware-algorithm co-design.
url: https://aboutme.hoesen.cc
baseurl: ""
lang: en-US
timezone: America/Chicago
theme: null # use this repo's own layouts, not the GitHub Pages default theme

# Shown in the sidebar and used for search engines and link previews.
author:
  name: Houxuan Guo
  bio: Ph.D. Candidate, Northwestern University
  avatar: /images/headshot.png
  location: Chicago, IL
  email: hguo@u.northwestern.edu
  # Optional profile links; any that are filled in appear in the sidebar.
  googlescholar:   # full URL
  github:          # username
  linkedin:        # full URL
  orcid:           # full URL

# The link preview image (WeChat, LinkedIn, Slack, X ...) is set under defaults.
social:
  name: Houxuan Guo
  links: []

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /images/og-card.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
