<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" class="no-js">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {% include masthead.html %}

  <div class="container page">
    {% include sidebar.html %}

    <main id="content" class="content">
      {% assign heading = page.heading | default: page.title %}
      {% if heading %}<h1 class="page-title">{{ heading }}</h1>{% endif %}
      {{ content }}
    </main>
  </div>

  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
