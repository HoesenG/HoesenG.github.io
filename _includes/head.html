<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
  // Apply the saved theme (auto, light or dark) before the page renders, so there is no flash.
  (function () {
    var root = document.documentElement;
    var pref = 'auto';
    try { pref = localStorage.getItem('theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    root.className = root.className.replace('no-js', 'js');
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-pref', pref);
  })();
</script>
