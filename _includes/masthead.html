{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Color theme: auto" title="Color theme: auto">
        <i class="fas fa-fw fa-adjust theme-toggle__icon theme-toggle__icon--auto" aria-hidden="true"></i>
        <i class="fas fa-fw fa-sun theme-toggle__icon theme-toggle__icon--light" aria-hidden="true"></i>
        <i class="fas fa-fw fa-moon theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true"></i>
        <span class="theme-toggle__label">Auto</span>
      </button>
    </div>
  </div>
</div>
