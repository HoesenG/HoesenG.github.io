<header class="masthead">
  <div class="container masthead__inner">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="masthead__nav" aria-label="Main">
      {% for link in site.data.navigation %}
        {% assign link_url = link.url | relative_url %}
        <a href="{{ link_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Color theme: auto" title="Color theme: auto">
      <span class="theme-toggle__knob">
        <svg class="theme-toggle__icon theme-toggle__icon--auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.75v1.5M12 19.75v1.5M4.4 4.4l1.06 1.06M18.54 18.54l1.06 1.06M2.75 12h1.5M19.75 12h1.5M4.4 19.6l1.06-1.06M18.54 5.46l1.06-1.06"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.25 14.6A8.5 8.5 0 0 1 9.4 3.75a8.5 8.5 0 1 0 10.85 10.85z" fill="currentColor"/></svg>
      </span>
      <span class="theme-toggle__label" aria-hidden="true"></span>
    </button>
  </div>
</header>
