<header class="masthead">
  <div class="container masthead__inner">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="masthead__nav" aria-label="Main">
      {% for link in site.data.navigation %}
        {% assign link_url = link.url | relative_url %}
        <a href="{{ link_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Color theme: auto" title="Color theme: auto">
      <span class="theme-toggle__signal" aria-hidden="true"></span>
      <span class="theme-toggle__label" aria-hidden="true"></span>
    </button>
  </div>
</header>
